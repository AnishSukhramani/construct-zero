[project]
name = "hcx-vpl"
version = "0.1.0"
description = "Voice Presentation Layer — extractive layered speech from long LLM replies (zero extra LLM calls)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcx_vpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
