[project]
name = "construct-zero"
version = "0.1.0"
description = "Construct-Zero — OpenAI-compatible adapter so Hermes runs on Cursor billing"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  "cursor-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]
cli = ["rich>=13", "pyfiglet>=1.0"]

[project.scripts]
construct-zero = "construct_zero.__main__:main"
hcx = "construct_zero.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/construct_zero"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["src/construct_zero"]

[[tool.mypy.overrides]]
module = "construct_zero.drivers.cursor"
ignore_errors = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
