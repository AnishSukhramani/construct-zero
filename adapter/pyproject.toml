[project]
name = "construct-zero"
version = "0.1.0"
description = "Construct-Zero — OpenAI-compatible adapter so Hermes runs on Cursor billing"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  "cursor-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
construct-zero = "construct_zero.__main__:main"
hcx = "construct_zero.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/construct_zero"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
