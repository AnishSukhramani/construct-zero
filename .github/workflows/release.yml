name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  hermes-pinned:
    uses: ./.github/workflows/hermes-pinned.yml

  first-run:
    uses: ./.github/workflows/first-run.yml

  release:
    name: release
    needs: [ci, hermes-pinned, first-run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Gate (no publish)
        run: |
          python3 scripts/ci/release-gate.py --tag "${GITHUB_REF_NAME}"

      - name: Build artifacts (upload only)
        run: |
          cd adapter && uv build
          cd ../vpl && uv build
          cd ../voice && uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            adapter/dist/*
            vpl/dist/*
            voice/dist/*
