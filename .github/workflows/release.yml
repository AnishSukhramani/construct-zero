name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  hermes-pinned:
    uses: ./.github/workflows/hermes-pinned.yml

  first-run:
    uses: ./.github/workflows/first-run.yml

  release:
    name: release
    needs: [ci, hermes-pinned, first-run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1634508e2153e83e015b5c7854
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: actions/setup-python@0a5c615913736835b9f498ebfc067dbe23224892
        with:
          python-version: "3.12"

      - name: Gate (no publish)
        run: |
          python3 scripts/ci/release-gate.py --tag "${GITHUB_REF_NAME}"

      - name: Build artifacts (upload only)
        run: |
          cd adapter && uv build
          cd ../vpl && uv build
          cd ../voice && uv build

      - uses: actions/upload-artifact@26f96df3d41fa9003ed2128245743547c2f8947a
        with:
          name: dist
          path: |
            adapter/dist/*
            vpl/dist/*
            voice/dist/*
