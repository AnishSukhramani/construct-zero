name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  hermes-pinned:
    uses: ./.github/workflows/hermes-pinned.yml

  first-run:
    uses: ./.github/workflows/first-run.yml

  release:
    name: release
    needs: [ci, hermes-pinned, first-run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Gate (no publish)
        run: |
          python3 scripts/ci/release-gate.py --tag "${GITHUB_REF_NAME}"

      - name: Build artifacts (upload only)
        run: |
          cd adapter && uv build
          cd ../vpl && uv build
          cd ../voice && uv build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            adapter/dist/*
            vpl/dist/*
            voice/dist/*
