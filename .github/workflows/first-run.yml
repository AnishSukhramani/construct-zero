name: first-run

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-run:
    name: first-run
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimal OS deps
        run: apt-get update && apt-get install -y git curl python3 ca-certificates

      - name: Unboxing (skip Hermes)
        shell: bash --noprofile --norc {0}
        env:
          FIRST_RUN_BUDGET_SEC: "300"
        run: |
          set -euo pipefail
          start_ts=$(date +%s)
          mkdir -p /tmp/cz-unbox
          cp -a "$GITHUB_WORKSPACE"/. /tmp/cz-unbox/
          cd /tmp/cz-unbox
          bash ./install.sh --auto --no-start --skip-hermes
          export CZ_BACKEND=mock
          ./construct-zero start
          sleep 2
          curl -sf http://127.0.0.1:8765/health
          curl -sf http://127.0.0.1:8765/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"auto","messages":[{"role":"user","content":"ping"}]}'
          elapsed=$(( $(date +%s) - start_ts ))
          echo "first_run_elapsed_sec=${elapsed}" >> "$GITHUB_STEP_SUMMARY"
          echo "first_run_elapsed_sec=${elapsed}" > "$GITHUB_WORKSPACE/first-run-timing.txt"
          if (( elapsed > FIRST_RUN_BUDGET_SEC )); then
            echo "Exceeded first-run timing budget (${FIRST_RUN_BUDGET_SEC}s)" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-run-timing
          path: first-run-timing.txt

  certify:
    name: certify
    runs-on: ubuntu-latest
    needs: first-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Certify (offline, mock backend)
        shell: bash --noprofile --norc {0}
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd adapter && uv sync --all-groups --extra dev
          cd "$GITHUB_WORKSPACE"
          export CZ_BACKEND=mock
          export CZ_DOCTOR_SKIP_HERMES=1
          ./construct-zero start &
          sleep 3
          ./construct-zero doctor --certify --json --offline | tee certify.json
          python3 scripts/ci/gen-certified-matrix.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cz-certify-json
          path: certify.json

  first-run-macos:
    name: first-run-macos
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          echo "Advisory macOS unboxing — set repo variable FIRST_RUN_MACOS_BLOCKING=1 to make this job blocking (reversible)."
