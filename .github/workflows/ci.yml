name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: package (${{ matrix.package }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [adapter, vpl, voice]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1634508e2153e83e015b5c7854

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: actions/setup-python@0a5c615913736835b9f498ebfc067dbe23224892
        with:
          python-version: ${{ matrix.python }}

      - name: Sync and test (${{ matrix.package }})
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            adapter)
              cd adapter
              uv sync --locked --extra dev
              uv run pytest -q
              ;;
            vpl)
              cd vpl
              uv sync --locked --extra dev
              uv run pytest -q
              ;;
            voice)
              cd voice
              uv sync --locked --extra dev --no-install-project
              uv pip install torch --index-url https://download.pytorch.org/whl/cpu
              uv pip install -e ".[dev]"
              uv run pytest -q
              ;;
          esac

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1634508e2153e83e015b5c7854

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: actions/setup-python@0a5c615913736835b9f498ebfc067dbe23224892
        with:
          python-version: "3.12"

      - name: Repo-level tests
        run: |
          cd adapter
          uv sync --locked --extra dev
          uv run pytest -q ../tests/repo

      - name: Matrix summary
        run: echo "All package matrix jobs passed."

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1634508e2153e83e015b5c7854
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/setup-python@0a5c615913736835b9f498ebfc067dbe23224892
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          cd adapter && uv sync --locked --extra dev
          uv run ruff check ../adapter ../vpl ../voice ../hermes-plugin ../tests

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1634508e2153e83e015b5c7854
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/setup-python@0a5c615913736835b9f498ebfc067dbe23224892
        with:
          python-version: "3.12"
      - name: mypy
        run: |
          cd adapter && uv sync --locked --extra dev && uv run mypy
          cd ..
          uv run --project adapter mypy --config-file vpl/mypy.ini
          uv run --project adapter mypy --config-file voice/mypy.ini

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1634508e2153e83e015b5c7854
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          shellcheck install.sh construct-zero scripts/*.sh scripts/lib/*.sh

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1634508e2153e83e015b5c7854
        with:
          fetch-depth: 0

      - name: Policy checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/guardrails.py
