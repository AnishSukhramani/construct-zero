name: hermes-pinned

on:
  workflow_call:
    inputs:
      hermes_ref:
        description: Hermes git SHA (40 hex)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: Optional override SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  hermes-pinned:
    name: hermes-pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve Hermes ref
        id: pin
        run: |
          ref="${{ inputs.hermes_ref }}"
          if [[ -z "$ref" ]]; then
            ref="$(python3 -c "import yaml;print(yaml.safe_load(open('config/upstream.lock.yaml'))['hermes']['ref'])")"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Fetch Hermes source
        run: |
          ref="${{ steps.pin.outputs.ref }}"
          git init "$RUNNER_TEMP/hermes-src"
          git -C "$RUNNER_TEMP/hermes-src" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-src" fetch --depth 1 origin "$ref"
          git -C "$RUNNER_TEMP/hermes-src" checkout FETCH_HEAD
          echo "HERMES_PIN_ROOT=$RUNNER_TEMP/hermes-src" >> "$GITHUB_ENV"

      - name: Install Hermes + plugin + adapter (mock)
        env:
          HERMES_PIN_ROOT: ${{ env.HERMES_PIN_ROOT }}
        run: |
          set -euo pipefail
          root="${GITHUB_WORKSPACE}"
          cd "$root/adapter" && uv sync --locked --extra dev
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          mkdir -p "$HERMES_HOME"
          bash "$root/scripts/install-hermes-plugin.sh"
          export PYTHONPATH="$HERMES_PIN_ROOT:${PYTHONPATH:-}"
          cd "$root/adapter" && uv run pytest -q ../tests/hermes_compat
