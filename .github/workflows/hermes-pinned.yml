name: hermes-pinned

on:
  workflow_call:
    inputs:
      hermes_ref:
        description: Hermes git SHA (40 hex)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: Optional override SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  hermes-pinned:
    name: hermes-pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1634508e2153e83e015b5c7854

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: actions/setup-python@0a5c615913736835b9f498ebfc067dbe23224892
        with:
          python-version: "3.12"

      - name: Resolve Hermes ref
        id: pin
        run: |
          ref="${{ inputs.hermes_ref }}"
          if [[ -z "$ref" ]]; then
            ref="$(python3 -c "import yaml;print(yaml.safe_load(open('config/upstream.lock.yaml'))['hermes']['ref'])")"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Fetch Hermes source
        run: |
          ref="${{ steps.pin.outputs.ref }}"
          git init "$RUNNER_TEMP/hermes-src"
          git -C "$RUNNER_TEMP/hermes-src" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-src" fetch --depth 1 origin "$ref"
          git -C "$RUNNER_TEMP/hermes-src" checkout FETCH_HEAD
          echo "HERMES_PIN_ROOT=$RUNNER_TEMP/hermes-src" >> "$GITHUB_ENV"

      - name: Install Hermes + plugin + adapter (mock)
        run: |
          cd adapter && uv sync --locked --extra dev
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          mkdir -p "$HERMES_HOME"
          bash scripts/install-hermes-plugin.sh
          cd adapter && uv run pytest -q ../tests/hermes_compat
