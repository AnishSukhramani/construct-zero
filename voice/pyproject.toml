[project]
name = "construct-zero-voice"
version = "0.1.0"
description = "Construct-Zero hold-to-talk voice sidecar — faster-whisper STT + Kokoro TTS + Hermes bridge"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.0",
  "faster-whisper>=1.0.0",
  "kokoro>=0.9.4",
  "torch>=2.0.0",
  "construct-zero-vpl",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
construct-zero-voice = "construct_zero_voice.__main__:main"
hcx-voice = "construct_zero_voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/construct_zero_voice"]

[tool.hatch.build.targets.wheel.force-include]
"src/construct_zero_voice/static" = "construct_zero_voice/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
